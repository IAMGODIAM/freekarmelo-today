name: Deploy Feed & Site

on:
  push:
    paths:
      - 'updates/feed.json'
      - 'index.html'
      - '*.html'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deploy even if no feed changes'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          echo "✅ Deployed to ${{ steps.deployment.outputs.page_url }}"
          curl -sI "${{ steps.deployment.outputs.page_url }}" | head -5